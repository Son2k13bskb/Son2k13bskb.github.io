<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chen Huangshan - custom link in bio website"
    />
    <title>Chen Huangshan | Link in Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>
    <div class="bg-orb orb-three"></div>

    <main class="page-shell">
      <section class="profile-card" aria-label="Profile section">
        <div class="status-dot" aria-hidden="true"></div>

        <div class="avatar-wrap">
          <div class="avatar" aria-label="Profile avatar">CH</div>
        </div>

        <p class="eyebrow">Creative • Builder • Designer</p>
        <h1>Chen Huangshan</h1>
        <p class="bio">
          I design thoughtful digital experiences, turn ideas into polished products,
          and build communities around creativity.
        </p>

        <div class="stats" aria-label="Highlights">
          <div class="stat-box">
            <strong>5+</strong>
            <span>Years</span>
          </div>
          <div class="stat-box">
            <strong>20+</strong>
            <span>Projects</span>
          </div>
          <div class="stat-box">
            <strong>24/7</strong>
            <span>Online</span>
          </div>
        </div>

        <nav class="link-list" aria-label="Main links">
          <a class="link-button primary" href="https://github.com" target="_blank" rel="noreferrer">
            <span class="icon">⌁</span>
            GitHub
          </a>
          <a class="link-button" href="https://instagram.com" target="_blank" rel="noreferrer">
            <span class="icon">◎</span>
            Instagram
          </a>
          <a class="link-button" href="https://dribbble.com" target="_blank" rel="noreferrer">
            <span class="icon">◌</span>
            Dribbble
          </a>
          <a class="link-button" href="https://www.behance.net" target="_blank" rel="noreferrer">
            <span class="icon">✦</span>
            Behance
          </a>
          <a class="link-button" href="mailto:hello@example.com" target="_blank" rel="noreferrer">
            <span class="icon">✉</span>
            Email Me
          </a>
          <a class="link-button" href="https://t.me/" target="_blank" rel="noreferrer">
            <span class="icon">➤</span>
            Telegram
          </a>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> Chen Huangshan</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
